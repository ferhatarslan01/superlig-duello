name: Maç sonu düellosu

on:
  # Zamanlama kapatıldı: Maç sonu artık dongu.yml içinde (5 dakikada bir kontrol) çalışıyor.
  # Elle çalıştırmak için Actions > Run workflow.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: superlig-bot-state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: ffmpeg (video uretimi icin)
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          ffmpeg -version | head -1

      - run: python post.py mac
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Durumu kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "Güncelle: maç durumu [skip ci]"
          git push || (git pull --rebase && git push)
