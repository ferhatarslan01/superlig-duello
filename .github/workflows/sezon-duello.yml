name: Sezon düellosu

on:
  # Haftalık otomatik paylaşım kapatıldı: sezon karşılaştırması artık maç öncesi (mac-oncesi.yml) çıkıyor.
  # Elle çalıştırmak için (isteğe bağlı iki oyuncu adıyla) Actions > Run workflow.
  workflow_dispatch:
    inputs:
      oyuncu1:
        description: 'İsteğe bağlı: birinci oyuncu (ad parçası, örn. Osimhen)'
        required: false
        default: ''
      oyuncu2:
        description: 'İsteğe bağlı: ikinci oyuncu (ad parçası, örn. Muriqi)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: superlig-bot-state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - run: python post.py sezon "$OYUNCU1" "$OYUNCU2"
        env:
          OYUNCU1: ${{ inputs.oyuncu1 }}
          OYUNCU2: ${{ inputs.oyuncu2 }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Durumu kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "Güncelle: sezon düellosu durumu [skip ci]"
          git push || (git pull --rebase && git push)
